name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_password # gitleaks:allow
          POSTGRES_DB: copilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_admin -d copilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://ci_admin:ci_password@localhost:5432/copilot_ci # gitleaks:allow
      APP_DB_PASSWORD: ci_app_password # gitleaks:allow
      DATABASE_URL: postgresql://copilot_app:ci_app_password@localhost:5432/copilot_ci # gitleaks:allow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Apply database migrations
        run: python -m src.infrastructure.migrate
      - name: Tests
        run: python -m pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t domain-copilot .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}